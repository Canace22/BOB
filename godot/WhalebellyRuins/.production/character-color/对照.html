<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>拾潮者 · 角色颜色修正</title><style>body{margin:32px auto;max-width:1200px;background:#101d26;color:#d7e4e6;font:16px/1.7 system-ui}h1{font-size:27px}p{max-width:940px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.detail{height:330px;overflow:hidden;position:relative;border:1px solid #36515c;background:#0b151b}.detail img{position:absolute;width:2560px;max-width:none;left:-130px;top:-840px}figure{margin:0}figcaption{padding:10px 0;color:#b2c8cd}img.full{width:100%}a{color:#85d3d3}@media(max-width:700px){body{margin:16px}.grid{grid-template-columns:1fr}}</style><h1>角色颜色修正 · 渲染重复乘色</h1><p>原着色器将贴图乘入已含贴图的COLOR，导致RGB和Alpha各乘了两遍。现改为只乘节点调制色一次，恢复原图明暗与透明边缘；没有重绘、改体型或覆盖原始动作帧。</p><div class="grid"><figure><figcaption>修正前：披风暗部压黑、灯光与红绳对比过强</figcaption><div class="detail"><img src="room1-before.png"></div></figure><figure><figcaption>修正后：恢复灰青披风层次、骨色面罩和透明边缘</figcaption><div class="detail"><img src="room1-after.png"></div></figure></div><p>上方仅用CSS放大实际GPU截图。6项专项检查通过：故障复现、原色/Alpha一致、受击闪白、两房材质接入、移动攻击分层。审查：Agent；主观美术接受由玩家判断。</p><h2>修正后的完整场景</h2><a href="room1-after.png"><img class="full" src="room1-after.png"></a><h2>移动攻击</h2><img class="full" src="moving-attack-after.png"></html>
