<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>16 格直出动画 · 四轮实验</title>
<style>body{max-width:1260px;margin:28px auto;padding:0 24px;background:#111c24;color:#e9e8dc;font:16px/1.6 system-ui}h1{font-size:27px}p{color:#bdcacf}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}canvas{width:100%;background:#263d48;display:block}article{border:1px solid #45606b;border-radius:10px;overflow:hidden}h2{font-size:17px;margin:12px}article p{font-size:14px;margin:12px}button,select,input{font:inherit}button,select{padding:5px 10px}label{display:inline-block;margin:8px}#frame{width:300px}a{color:#8edcd5}.controls{position:sticky;top:0;background:#111c24;padding:12px 0;z-index:1}summary{cursor:pointer}.warning{color:#f0c17d}</style>
<h1>直接生成 16 格序列：四轮对照</h1><p>同一角色、同一方向、同一帧数。每轮只生成一张图，结果是探索性样本，不能据此认定成功率。四版均未通过正式动画验收。</p>
<div class="controls"><button id="toggle">暂停</button> <button id="prev">上一帧</button> <button id="next">下一帧</button><label>速度 <select id="speed"><option value="8">8 fps</option><option value="16" selected>16 fps</option><option value="24">24 fps</option></select></label><label><input id="seam" type="checkbox">只看 15→16→1→2</label><label><input id="background" type="checkbox">浅色背景</label><div><input id="frame" aria-label="帧序号" type="range" min="0" max="15" value="0"> <span id="status">加载中</span></div></div>
<div class="grid" id="grid"></div>
<p class="warning">没有调换帧序、补间或拉伸来掩盖问题。边缘触碰是裁切风险提示，并不自动等于缺肢。轮廓差只能定位跳变，不能证明双腿交替或动作自然。</p>
<details><summary>姿势引导图 D（只用于生成参考）</summary><img src="motion-guide.png" alt="16格骨架引导图" style="max-width:800px;width:100%"></details>
<p><a href="README.md">实验记录</a> · <a href="comparison.json">测量数据</a> · <a href="preview.html">最初 A 版预览</a></p>
<script>
const trials=[{id:'A',dir:'.',title:'文字描述 16 个相位',note:'初始候选；后半周期与首帧跳变明显。'},{id:'B',dir:'variants/b',title:'编辑 A，强调循环衔接',note:'错误姿势仍保留；更多文字没有可靠纠正步态。'},{id:'C',dir:'variants/c',title:'从角色原图重新生成',note:'改用近腿/远腿和四个关键姿势，仍有腿部相位偏差。'},{id:'D',dir:'variants/d',title:'角色图 + 16 格姿势图',note:'姿势有所变化，仍未准确跟随参考；手部与边缘待修。'}];
const grid=document.querySelector('#grid'),slider=document.querySelector('#frame'),status=document.querySelector('#status'),toggle=document.querySelector('#toggle'),seam=document.querySelector('#seam');let frame=0,playing=true,elapsed=0,last=0,loaded=0;
for(const t of trials){const a=document.createElement('article');a.innerHTML='<h2>'+t.id+' · '+t.title+'</h2><canvas width="314" height="314"></canvas><p>'+t.note+'</p><p class="measure"></p>';grid.append(a);t.canvas=a.querySelector('canvas');t.measure=a.querySelector('.measure');t.images=[];}
function draw(){for(const t of trials){const ctx=t.canvas.getContext('2d');ctx.clearRect(0,0,314,314);ctx.drawImage(t.images[frame],0,0);const f=t.data.frames[frame];t.measure.textContent='首尾轮廓差 '+(t.data.diagnostics.seamDifference*100).toFixed(1)+'% · 本帧边缘像素 '+f.borderPixels;}slider.value=frame;status.textContent='第 '+(frame+1)+' / 16 帧'+(frame===15?' · 下一帧回到 1':'');}
function pause(){playing=false;toggle.textContent='播放';elapsed=0;}
function seek(n){pause();frame=(n+16)%16;draw();}
function advance(){if(!seam.checked){frame=(frame+1)%16;return}const seq=[14,15,0,1];frame=seq[(seq.indexOf(frame)+1)%4];}
toggle.onclick=()=>{playing=!playing;elapsed=0;toggle.textContent=playing?'暂停':'播放'};document.querySelector('#prev').onclick=()=>seek(frame-1);document.querySelector('#next').onclick=()=>seek(frame+1);slider.oninput=()=>seek(Number(slider.value));document.querySelector('#speed').onchange=()=>elapsed=0;seam.onchange=()=>{frame=14;elapsed=0;draw()};document.querySelector('#background').onchange=e=>trials.forEach(t=>t.canvas.style.background=e.target.checked?'#e5ddd0':'#263d48');
Promise.all(trials.map(async t=>{t.data=await (await fetch(t.dir+'/animation.json')).json();await Promise.all(t.data.frames.map((f,i)=>new Promise((resolve,reject)=>{const img=new Image();t.images[i]=img;img.onload=()=>{loaded++;resolve()};img.onerror=reject;img.src=t.dir+'/'+f.file})));})).then(()=>{draw();requestAnimationFrame(tick)}).catch(e=>{status.textContent='加载失败：'+e.message});
function tick(time){if(playing){elapsed+=last?Math.min(time-last,250):0;const duration=1000/Number(document.querySelector('#speed').value);while(elapsed>=duration){advance();elapsed-=duration;draw()}}last=time;requestAnimationFrame(tick)}
window.trialComparison={getState:()=>({frame,playing,loaded,seam:seam.checked,fps:Number(document.querySelector('#speed').value)}),seek};
</script></html>
