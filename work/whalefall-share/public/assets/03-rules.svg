<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="可执行规则示意 · 一鲸万生"><title>可执行规则示意 · 一鲸万生</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#76dcc7"/></marker></defs><rect width="1000" height="430" fill="#0b2029"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="44" font-size="25" fill="#e9f3ef" text-anchor="start" font-weight="600">可执行规则示意 · 一鲸万生</text><rect x="49" y="97" width="252" height="178" rx="10" fill="#15323d" stroke="#34505c"/><rect x="40" y="87" width="252" height="178" rx="10" fill="#15323d" stroke="#f5c97d"/><text x="166" y="149" font-size="25" fill="#f5c97d" text-anchor="middle" font-weight="600">肉 + 蟹</text><text x="166" y="211" font-size="20" fill="#e9f3ef" text-anchor="middle" font-weight="400">肉 −1 → 营养 +2</text><rect x="374" y="97" width="252" height="178" rx="10" fill="#15323d" stroke="#34505c"/><rect x="365" y="87" width="252" height="178" rx="10" fill="#15323d" stroke="#76dcc7"/><text x="491" y="149" font-size="25" fill="#76dcc7" text-anchor="middle" font-weight="600">骨 + 菌</text><text x="491" y="211" font-size="20" fill="#e9f3ef" text-anchor="middle" font-weight="400">骨 −1 → 营养 +1</text><rect x="699" y="97" width="252" height="178" rx="10" fill="#15323d" stroke="#34505c"/><rect x="690" y="87" width="252" height="178" rx="10" fill="#15323d" stroke="#88bbef"/><text x="816" y="149" font-size="25" fill="#88bbef" text-anchor="middle" font-weight="600">管虫 + 营养</text><text x="816" y="211" font-size="20" fill="#e9f3ef" text-anchor="middle" font-weight="400">营养 −1 → 研究 +1</text><text x="500" y="314" font-size="23" fill="#e9f3ef" text-anchor="middle" font-weight="400">潮汐结束：生产结算 → 维持检查 → 显示净变化</text><text x="500" y="365" font-size="22" fill="#a5c3c5" text-anchor="middle" font-weight="400">肉不会刷新。提前建立骨链，才能避免后期全桌断粮。</text></g></svg>