<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="可执行规则示意 · 最后一潜"><title>可执行规则示意 · 最后一潜</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#76dcc7"/></marker></defs><rect width="1000" height="430" fill="#0b2029"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="44" font-size="25" fill="#e9f3ef" text-anchor="start" font-weight="600">可执行规则示意 · 最后一潜</text><text x="40" y="98" font-size="23" fill="#e9f3ef" text-anchor="start" font-weight="400">继续采样的电量账本</text><rect x="40" y="135" width="680" height="35" rx="3" fill="#19313a" stroke="none"/><rect x="40" y="135" width="600" height="35" rx="3" fill="#76dcc7" stroke="none"/><text x="750" y="161" font-size="21" fill="#76dcc7" text-anchor="start" font-weight="400">现有电量 30</text><rect x="40" y="205" width="680" height="35" rx="3" fill="#19313a" stroke="none"/><rect x="40" y="205" width="440" height="35" rx="3" fill="#88bbef" stroke="none"/><text x="750" y="231" font-size="21" fill="#88bbef" text-anchor="start" font-weight="400">安全返程 22</text><rect x="40" y="275" width="680" height="35" rx="3" fill="#19313a" stroke="none"/><rect x="40" y="275" width="680" height="35" rx="3" fill="#f29e90" stroke="none"/><text x="750" y="301" font-size="21" fill="#f29e90" text-anchor="start" font-weight="400">采样后总需求 34</text><text x="40" y="368" font-size="22" fill="#e9f3ef" text-anchor="start" font-weight="400">22 返程 + 4 采样 + 8 绕行 = 34；缺口 4，需要弃货或立即回撤。</text></g></svg>