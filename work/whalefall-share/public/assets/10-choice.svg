<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-label="一次实际决策 · 给新生命一个家"><title>一次实际决策 · 给新生命一个家</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#76dcc7"/></marker></defs><rect width="1000" height="410" fill="#0b2029"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="44" font-size="25" fill="#e9f3ef" text-anchor="start" font-weight="600">一次实际决策 · 给新生命一个家</text><rect x="337" y="77" width="326" height="64" rx="10" fill="#15323d" stroke="#f5c97d"/><text x="500.0" y="117.0" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="600">大庇护所待摆放</text><path d="M420,143 L249,181" fill="none" stroke="#76dcc7" stroke-width="3" marker-end="url(#arrow)" /><path d="M580,143 L750,181" fill="none" stroke="#76dcc7" stroke-width="3" marker-end="url(#arrow)" /><rect x="54" y="190" width="420" height="147" rx="10" fill="#15323d" stroke="#f5c97d"/><text x="76" y="226" font-size="24" fill="#f5c97d" text-anchor="start" font-weight="600">放在中央</text><text x="76" y="269" font-size="22" fill="#e9f3ef" text-anchor="start" font-weight="400">立即容纳幼体</text><text x="76" y="310" font-size="21" fill="#a5c3c5" text-anchor="start" font-weight="400">堵住两处水道</text><rect x="526" y="190" width="420" height="147" rx="10" fill="#15323d" stroke="#76dcc7"/><text x="548" y="226" font-size="24" fill="#76dcc7" text-anchor="start" font-weight="600">沿肋骨旋转摆放</text><text x="548" y="269" font-size="22" fill="#e9f3ef" text-anchor="start" font-weight="400">占用边缘空间</text><text x="548" y="310" font-size="21" fill="#a5c3c5" text-anchor="start" font-weight="400">保留水流贯通</text><text x="500" y="379" font-size="19" fill="#a5c3c5" text-anchor="middle" font-weight="400">两条路径都要有可解释的收益与代价；具体平衡由原型试玩校准</text></g></svg>