<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="可执行规则示意 · 骨海拼图"><title>可执行规则示意 · 骨海拼图</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#76dcc7"/></marker></defs><rect width="1000" height="430" fill="#0b2029"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="44" font-size="25" fill="#e9f3ef" text-anchor="start" font-weight="600">可执行规则示意 · 骨海拼图</text><polygon points="234.0,218.0 202.0,273.4 138.0,273.4 106.0,218.0 138.0,162.6 202.0,162.6" fill="#193d46" stroke="#f5c97d" stroke-width="3"/><text x="170" y="225" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="400">骨区</text><polygon points="334.0,162.0 302.0,217.4 238.0,217.4 206.0,162.0 238.0,106.6 302.0,106.6" fill="#193d46" stroke="#76dcc7" stroke-width="3"/><text x="270" y="169" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="400">菌毯</text><polygon points="334.0,276.0 302.0,331.4 238.0,331.4 206.0,276.0 238.0,220.6 302.0,220.6" fill="#193d46" stroke="#76dcc7" stroke-width="3"/><text x="270" y="283" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="400">菌毯</text><polygon points="434.0,218.0 402.0,273.4 338.0,273.4 306.0,218.0 338.0,162.6 402.0,162.6" fill="#193d46" stroke="#76dcc7" stroke-width="3"/><text x="370" y="225" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="400">菌毯</text><text x="270" y="365" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="400">完成订单：连通骨区 + 3 菌毯</text><rect x="535" y="99" width="410" height="80" rx="10" fill="#15323d" stroke="#f5c97d"/><text x="740.0" y="139.0" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="600">落子前库存：4</text><text x="740.0" y="169.0" font-size="18" fill="#a5c3c5" text-anchor="middle" font-weight="400">旋转后，同类边每对得 2 分</text><path d="M740,190 L740,229" fill="none" stroke="#76dcc7" stroke-width="3" marker-end="url(#arrow)" /><rect x="535" y="242" width="410" height="100" rx="10" fill="#15323d" stroke="#76dcc7"/><text x="740.0" y="292.0" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="600">落子后库存：6</text><text x="740.0" y="322.0" font-size="18" fill="#a5c3c5" text-anchor="middle" font-weight="400">4 − 落子1 + 订单奖励3 = 6</text><text x="742" y="387" font-size="20" fill="#a5c3c5" text-anchor="middle" font-weight="400">每份订单只能奖励一次</text></g></svg>