<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1920" role="img" aria-label="连接剖面 · 为什么能抵达下一关"><defs><marker id="natural" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7bced3"/></marker><marker id="damage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#df9c67"/></marker><marker id="built" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e17f79"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}a:hover rect{stroke:#fff}a:focus rect{stroke:#fff}</style><rect width="1800" height="1920" fill="#0b1c25"/><text x="60" y="64" font-size="18" fill="#88a6ad" letter-spacing="4">WHALEFALL / ANATOMICAL PLACEMENT</text><text x="60" y="120" font-size="44" fill="#d2e1dd" >连接剖面 · 为什么能抵达下一关</text><text x="60" y="164" font-size="22" fill="#88a6ad" >蓝：天然腔道走向 / 橙：死后破口与剥离 / 红：聚落修补、锚环与开闩</text><rect x="60" y="220" width="810" height="440" rx="14" fill="#122b36" stroke="#335460" stroke-width="2"/><text x="84" y="262" font-size="26" fill="#d8bd82" >E05  口咽 → 食管 → 前胃</text><path d="M86 320Q240 285 380 325T840 325L840 495Q660 525 480 490T86 495Z" fill="#29414a" stroke="#587079" stroke-width="2"/><rect x="85" y="365" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="167.5" y="399" font-size="20" fill="#d2e1dd" text-anchor="middle">口咽</text><path d="M252,408L270,408" fill="none" stroke="#7bced3" stroke-width="4" marker-end="url(#natural)"/><rect x="275" y="365" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="357.5" y="399" font-size="20" fill="#d2e1dd" text-anchor="middle">食管纵裂边</text><path d="M442,408L460,408" fill="none" stroke="#df9c67" stroke-width="4" marker-end="url(#damage)"/><path d="M445 349l8 15l-8 15l8 15l-8 15l8 15l-8 15" fill="none" stroke="#df9c67" stroke-width="3"/><rect x="465" y="365" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="547.5" y="399" font-size="20" fill="#d2e1dd" text-anchor="middle">横膈食管裂孔</text><path d="M632,408L650,408" fill="none" stroke="#7bced3" stroke-width="4" marker-end="url(#natural)"/><rect x="655" y="365" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="737.5" y="399" font-size="20" fill="#d2e1dd" text-anchor="middle">前胃</text><text x="86" y="545" font-size="21" fill="#88a6ad" >食管方向天然相续，通行宽度由死后纵裂边提供；不把健康食管扩大成宫殿</text><text x="86" y="578" font-size="21" fill="#88a6ad" >。</text><rect x="930" y="220" width="810" height="440" rx="14" fill="#122b36" stroke="#335460" stroke-width="2"/><text x="954" y="262" font-size="26" fill="#d8bd82" >E10  胃外侧 → 横膈旧伤 → 肺后缘</text><path d="M956 320Q1110 285 1250 325T1710 325L1710 495Q1530 525 1350 490T956 495Z" fill="#29414a" stroke="#587079" stroke-width="2"/><rect x="955" y="365" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="1037.5" y="399" font-size="20" fill="#d2e1dd" text-anchor="middle">胃壁外缘</text><path d="M1122,408L1140,408" fill="none" stroke="#df9c67" stroke-width="4" marker-end="url(#damage)"/><path d="M1125 349l8 15l-8 15l8 15l-8 15l8 15l-8 15" fill="none" stroke="#df9c67" stroke-width="3"/><rect x="1145" y="365" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="1227.5" y="399" font-size="20" fill="#d2e1dd" text-anchor="middle">胃壁旧破口</text><path d="M1312,408L1330,408" fill="none" stroke="#df9c67" stroke-width="4" marker-end="url(#damage)"/><path d="M1315 349l8 15l-8 15l8 15l-8 15l8 15l-8 15" fill="none" stroke="#df9c67" stroke-width="3"/><rect x="1335" y="365" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="1417.5" y="399" font-size="20" fill="#d2e1dd" text-anchor="middle">横膈旧撕裂</text><path d="M1502,408L1520,408" fill="none" stroke="#e17f79" stroke-width="4" marker-end="url(#built)"/><rect x="1525" y="365" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="1607.5" y="399" font-size="20" fill="#d2e1dd" text-anchor="middle">肺后缘胸膜</text><text x="956" y="545" font-size="21" fill="#88a6ad" >跨越消化器官与胸腔的隔界，必须显示胃壁与横膈两道受损边界；不是胃的</text><text x="956" y="578" font-size="21" fill="#88a6ad" >天然分叉。</text><rect x="60" y="695" width="810" height="440" rx="14" fill="#122b36" stroke="#335460" stroke-width="2"/><text x="84" y="737" font-size="26" fill="#d8bd82" >E17  回折肠袢 → 胃侧回程</text><path d="M86 795Q240 760 380 800T840 800L840 970Q660 1000 480 965T86 970Z" fill="#29414a" stroke="#587079" stroke-width="2"/><rect x="85" y="840" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="167.5" y="874" font-size="20" fill="#d2e1dd" text-anchor="middle">回折肠袢</text><path d="M252,883L270,883" fill="none" stroke="#7bced3" stroke-width="4" marker-end="url(#natural)"/><rect x="275" y="840" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="357.5" y="874" font-size="20" fill="#d2e1dd" text-anchor="middle">系膜维护坡</text><path d="M442,883L460,883" fill="none" stroke="#e17f79" stroke-width="4" marker-end="url(#built)"/><rect x="465" y="840" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="547.5" y="874" font-size="20" fill="#d2e1dd" text-anchor="middle">前胃外壁破口</text><path d="M632,883L650,883" fill="none" stroke="#df9c67" stroke-width="4" marker-end="url(#damage)"/><path d="M635 824l8 15l-8 15l8 15l-8 15l8 15l-8 15" fill="none" stroke="#df9c67" stroke-width="3"/><rect x="655" y="840" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="737.5" y="874" font-size="20" fill="#d2e1dd" text-anchor="middle">胃枢</text><text x="86" y="1020" font-size="21" fill="#88a6ad" >肠袢向头回弯后与胃外壁邻近。旧称“食道闩”仅是旧名，不是肠管天然接</text><text x="86" y="1053" font-size="21" fill="#88a6ad" >食管。</text><rect x="930" y="695" width="810" height="440" rx="14" fill="#122b36" stroke="#335460" stroke-width="2"/><text x="954" y="737" font-size="26" fill="#d8bd82" >E18  腹腔背侧 → 椎旁外廊</text><path d="M956 795Q1110 760 1250 800T1710 800L1710 970Q1530 1000 1350 965T956 970Z" fill="#29414a" stroke="#587079" stroke-width="2"/><rect x="955" y="840" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="1037.5" y="874" font-size="20" fill="#d2e1dd" text-anchor="middle">胃外侧</text><path d="M1122,883L1140,883" fill="none" stroke="#df9c67" stroke-width="4" marker-end="url(#damage)"/><path d="M1125 824l8 15l-8 15l8 15l-8 15l8 15l-8 15" fill="none" stroke="#df9c67" stroke-width="3"/><rect x="1145" y="840" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="1227.5" y="874" font-size="20" fill="#d2e1dd" text-anchor="middle">腹背创伤口</text><path d="M1312,883L1330,883" fill="none" stroke="#df9c67" stroke-width="4" marker-end="url(#damage)"/><path d="M1315 824l8 15l-8 15l8 15l-8 15l8 15l-8 15" fill="none" stroke="#df9c67" stroke-width="3"/><rect x="1335" y="840" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="1417.5" y="874" font-size="20" fill="#d2e1dd" text-anchor="middle">椎体外缘</text><path d="M1502,883L1520,883" fill="none" stroke="#e17f79" stroke-width="4" marker-end="url(#built)"/><rect x="1525" y="840" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="1607.5" y="874" font-size="20" fill="#d2e1dd" text-anchor="middle">固定闸</text><text x="956" y="1020" font-size="21" fill="#88a6ad" >沿外露椎体和肌腱面通行；P稳定海水流、A3拉聚落闸。路线不在椎管或</text><text x="956" y="1053" font-size="21" fill="#88a6ad" >骨髓里。</text><rect x="60" y="1170" width="810" height="440" rx="14" fill="#122b36" stroke="#335460" stroke-width="2"/><text x="84" y="1212" font-size="26" fill="#d8bd82" >E25  腰尾分流 → 向头长回廊</text><path d="M86 1270Q240 1235 380 1275T840 1275L840 1445Q660 1475 480 1440T86 1445Z" fill="#29414a" stroke="#587079" stroke-width="2"/><rect x="85" y="1315" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="167.5" y="1349" font-size="20" fill="#d2e1dd" text-anchor="middle">后腰 / 腰尾</text><path d="M252,1358L270,1358" fill="none" stroke="#e17f79" stroke-width="4" marker-end="url(#built)"/><rect x="275" y="1315" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="357.5" y="1349" font-size="20" fill="#d2e1dd" text-anchor="middle">椎旁向头60–</text><text x="357.5" y="1374" font-size="20" fill="#d2e1dd" text-anchor="middle">70m</text><path d="M442,1358L460,1358" fill="none" stroke="#7bced3" stroke-width="4" marker-end="url(#natural)"/><rect x="465" y="1315" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="547.5" y="1349" font-size="20" fill="#d2e1dd" text-anchor="middle">颈后 / 枕骨</text><text x="547.5" y="1374" font-size="20" fill="#d2e1dd" text-anchor="middle">侧</text><path d="M632,1358L650,1358" fill="none" stroke="#df9c67" stroke-width="4" marker-end="url(#damage)"/><path d="M635 1299l8 15l-8 15l8 15l-8 15l8 15l-8 15" fill="none" stroke="#df9c67" stroke-width="3"/><rect x="655" y="1315" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="737.5" y="1349" font-size="20" fill="#d2e1dd" text-anchor="middle">耳周创伤区</text><text x="86" y="1495" font-size="21" fill="#88a6ad" >头耳不是分流台旁边的一间房。用连续椎列与头向过渡镜头交代长距离，不</text><text x="86" y="1528" font-size="21" fill="#88a6ad" >新增战斗房。</text><rect x="930" y="1170" width="810" height="440" rx="14" fill="#122b36" stroke="#335460" stroke-width="2"/><text x="954" y="1212" font-size="26" fill="#d8bd82" >E34  前胸回流 → 喉 / 鼻道 → 喷气孔</text><path d="M956 1270Q1110 1235 1250 1275T1710 1275L1710 1445Q1530 1475 1350 1440T956 1445Z" fill="#29414a" stroke="#587079" stroke-width="2"/><rect x="955" y="1315" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="1037.5" y="1349" font-size="20" fill="#d2e1dd" text-anchor="middle">心包侧破口</text><path d="M1122,1358L1140,1358" fill="none" stroke="#df9c67" stroke-width="4" marker-end="url(#damage)"/><path d="M1125 1299l8 15l-8 15l8 15l-8 15l8 15l-8 15" fill="none" stroke="#df9c67" stroke-width="3"/><rect x="1145" y="1315" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="1227.5" y="1349" font-size="20" fill="#d2e1dd" text-anchor="middle">气管旁 / 喉</text><text x="1227.5" y="1374" font-size="20" fill="#d2e1dd" text-anchor="middle">遗迹</text><path d="M1312,1358L1330,1358" fill="none" stroke="#7bced3" stroke-width="4" marker-end="url(#natural)"/><rect x="1335" y="1315" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="1417.5" y="1349" font-size="20" fill="#d2e1dd" text-anchor="middle">鼻道纵裂台</text><path d="M1502,1358L1520,1358" fill="none" stroke="#e17f79" stroke-width="4" marker-end="url(#built)"/><rect x="1525" y="1315" width="165" height="86" rx="24" fill="#102832" stroke="#627b80" stroke-width="2"/><text x="1607.5" y="1349" font-size="20" fill="#d2e1dd" text-anchor="middle">头顶双孔内缘</text><text x="956" y="1495" font-size="21" fill="#88a6ad" >先从心区退到纵隔与气管旁，再沿呼吸道方向上行。没有心室直接长到头顶</text><text x="956" y="1528" font-size="21" fill="#88a6ad" >的气柱。</text><rect x="60" y="1670" width="1680" height="165" rx="14" fill="#122b36" stroke="#335460" stroke-width="2"/><text x="87" y="1712" font-size="27" fill="#8eb6df" >补充 E31 / 尾向过渡约15–20m</text><text x="87" y="1754" font-size="22" fill="#d2e1dd" >从R4-06沿渐细尾椎外缘前进到R5-07尾柄窝；继续R5-08穿纤维尾鳍裂缘到外海。尾鳍瓣没有新骨架。</text><text x="60" y="1880" font-size="21" fill="#d8bd82" >关系类型是本轮关卡设计解释；实际鲸体不是开放空洞迷宫。米数为幻想世界布局估算。</text></svg>