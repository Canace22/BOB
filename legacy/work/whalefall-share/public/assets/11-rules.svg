<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="可执行规则示意 · 骨脉工坊"><title>可执行规则示意 · 骨脉工坊</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#76dcc7"/></marker></defs><rect width="1000" height="430" fill="#0b2029"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="44" font-size="25" fill="#e9f3ef" text-anchor="start" font-weight="600">可执行规则示意 · 骨脉工坊</text><rect x="30" y="162" width="200" height="95" rx="10" fill="#15323d" stroke="#f5c97d"/><text x="130.0" y="209.5" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="600">有限骨质 40</text><text x="130.0" y="239.5" font-size="18" fill="#a5c3c5" text-anchor="middle" font-weight="400">每秒提取 1</text><path d="M238,210 L304,210" fill="none" stroke="#76dcc7" stroke-width="3" marker-end="url(#arrow)" /><rect x="314" y="162" width="228" height="95" rx="10" fill="#15323d" stroke="#76dcc7"/><text x="428.0" y="209.5" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="600">菌床</text><text x="428.0" y="239.5" font-size="18" fill="#a5c3c5" text-anchor="middle" font-weight="400">每 2 秒：2 骨 → 3 营养</text><path d="M550,210 L663,210" fill="none" stroke="#f29e90" stroke-width="8" /><text x="605" y="155" font-size="20" fill="#f29e90" text-anchor="middle" font-weight="400">单管 1 / 秒</text><rect x="681" y="162" width="280" height="95" rx="10" fill="#15323d" stroke="#88bbef"/><text x="821.0" y="209.5" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="600">培养器</text><text x="821.0" y="239.5" font-size="18" fill="#a5c3c5" text-anchor="middle" font-weight="400">每 3 秒：3 营养 → 1 囊</text><text x="500" y="308" font-size="23" fill="#e9f3ef" text-anchor="middle" font-weight="400">菌床产率 1.5 / 秒 ＞ 单管容量 1 / 秒 → 出口是瓶颈</text><text x="500" y="367" font-size="21" fill="#a5c3c5" text-anchor="middle" font-weight="400">目标 8 囊至少需要 24 营养，即 16 骨质；余量用于试验与损耗。</text></g></svg>