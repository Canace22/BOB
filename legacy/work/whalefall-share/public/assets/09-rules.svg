<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="可执行规则示意 · 深渊标本室"><title>可执行规则示意 · 深渊标本室</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#76dcc7"/></marker></defs><rect width="1000" height="430" fill="#0b2029"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="44" font-size="25" fill="#e9f3ef" text-anchor="start" font-weight="600">可执行规则示意 · 深渊标本室</text><rect x="40" y="110" width="270" height="155" rx="10" fill="#15323d" stroke="#76dcc7"/><text x="175.0" y="187.5" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="600">红色冠部</text><text x="175.0" y="217.5" font-size="18" fill="#a5c3c5" text-anchor="middle" font-weight="400">符合 A / B</text><text x="175" y="92" font-size="21" fill="#a5c3c5" text-anchor="middle" font-weight="400">线索 1</text><rect x="365" y="110" width="270" height="155" rx="10" fill="#15323d" stroke="#76dcc7"/><text x="500.0" y="187.5" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="600">白色骨片</text><text x="500.0" y="217.5" font-size="18" fill="#a5c3c5" text-anchor="middle" font-weight="400">符合 B / C</text><text x="500" y="92" font-size="21" fill="#a5c3c5" text-anchor="middle" font-weight="400">线索 2</text><rect x="690" y="110" width="270" height="155" rx="10" fill="#15323d" stroke="#76dcc7"/><text x="825.0" y="187.5" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="600">B 同时符合</text><text x="825.0" y="217.5" font-size="18" fill="#a5c3c5" text-anchor="middle" font-weight="400">提交至少两条证据</text><text x="825" y="92" font-size="21" fill="#a5c3c5" text-anchor="middle" font-weight="400">交叉结论</text><path d="M314,188 L352,188" fill="none" stroke="#76dcc7" stroke-width="3" marker-end="url(#arrow)" /><path d="M639,188 L677,188" fill="none" stroke="#76dcc7" stroke-width="3" marker-end="url(#arrow)" /><text x="500" y="329" font-size="21" fill="#e9f3ef" text-anchor="middle" font-weight="400">候选 A：红冠 + 岩面  /  B：红冠 + 骨区  /  C：白冠 + 骨区</text><text x="500" y="383" font-size="20" fill="#a5c3c5" text-anchor="middle" font-weight="400">来源记录可作第三条核验；答案由交叉证据得出，不靠外部冷知识</text></g></svg>