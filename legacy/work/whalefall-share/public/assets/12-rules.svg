<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="可执行规则示意 · 最后一座骨城"><title>可执行规则示意 · 最后一座骨城</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#76dcc7"/></marker></defs><rect width="1000" height="430" fill="#0b2029"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="44" font-size="25" fill="#e9f3ef" text-anchor="start" font-weight="600">可执行规则示意 · 最后一座骨城</text><rect x="30" y="105" width="290" height="110" rx="10" fill="#15323d" stroke="#f5c97d"/><text x="175.0" y="160.0" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="600">采食岗位</text><text x="175.0" y="190.0" font-size="18" fill="#a5c3c5" text-anchor="middle" font-weight="400">每人：2 软组织 → 3 食物</text><rect x="355" y="105" width="290" height="110" rx="10" fill="#15323d" stroke="#76dcc7"/><text x="500.0" y="160.0" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="600">菌培房</text><text x="500.0" y="190.0" font-size="18" fill="#a5c3c5" text-anchor="middle" font-weight="400">2 人运营 → 每日 2 食物</text><rect x="680" y="105" width="290" height="110" rx="10" fill="#15323d" stroke="#88bbef"/><text x="825.0" y="160.0" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="600">迁徙准备</text><text x="825.0" y="190.0" font-size="18" fill="#a5c3c5" text-anchor="middle" font-weight="400">12 食物 + 3 囊 → 离开</text><path d="M80,293 L925,293" fill="none" stroke="#76dcc7" stroke-width="4" marker-end="url(#arrow)" /><circle cx="90" cy="293" r="8" fill="#f5c97d" stroke="none"/><text x="90" y="268" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="400">第 1 天</text><text x="90" y="343" font-size="19" fill="#a5c3c5" text-anchor="middle" font-weight="400">软组织 24 / 食物 18</text><circle cx="460" cy="293" r="8" fill="#f5c97d" stroke="none"/><text x="460" y="268" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="400">中期</text><text x="460" y="343" font-size="19" fill="#a5c3c5" text-anchor="middle" font-weight="400">停止扩张 / 备粮</text><circle cx="870" cy="293" r="8" fill="#f5c97d" stroke="none"/><text x="870" y="268" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="400">第 10—12 天</text><text x="870" y="343" font-size="19" fill="#a5c3c5" text-anchor="middle" font-weight="400">迁徙潮窗</text><text x="500" y="399" font-size="22" fill="#e9f3ef" text-anchor="middle" font-weight="400">6 居民每天吃 6 食物；供给下降前就必须储备迁徙资源</text></g></svg>