<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1600" role="img" aria-label="尺度与镜头 · 巨鲸不是小房间集合"><defs><marker id="natural" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7bced3"/></marker><marker id="damage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#df9c67"/></marker><marker id="built" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e17f79"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}a:hover rect{stroke:#fff}a:focus rect{stroke:#fff}</style><rect width="1800" height="1600" fill="#0b1c25"/><text x="60" y="64" font-size="18" fill="#88a6ad" letter-spacing="4">WHALEFALL / ANATOMICAL PLACEMENT</text><text x="60" y="120" font-size="44" fill="#d2e1dd" >尺度与镜头 · 巨鲸不是小房间集合</text><text x="60" y="164" font-size="22" fill="#88a6ad" >固定尺寸：虚构鲸长120m = 400U；拾潮者身高0.30m = 1U</text><rect x="60" y="220" width="1680" height="500" rx="14" fill="#122b36" stroke="#335460" stroke-width="2"/><g transform="translate(85 230) scale(0.95)"><path d="M90 260 C85 175 155 140 260 135 C355 130 410 149 470 145 C700 90 1030 130 1310 240 L1400 250 Q1470 185 1600 155 L1535 270 L1595 370 Q1480 355 1400 300 C1170 465 610 470 280 375 Q140 355 90 300Z" fill="#203d49" stroke="#62838b" stroke-width="3"/><path d="M105 285Q225 310 340 294M300 388Q350 440 448 430L410 387" fill="none" stroke="#62838b" stroke-width="3"/></g><path d="M170,680L1600,680" fill="none" stroke="#d8bd82" stroke-width="3" /><path d="M170,665L170,695" fill="none" stroke="#d8bd82" stroke-width="3" /><path d="M1600,665L1600,695" fill="none" stroke="#d8bd82" stroke-width="3" /><text x="885" y="661" font-size="26" fill="#d8bd82" text-anchor="middle">120 m / 400 U</text><rect x="219.4" y="623.2" width="1.2" height="3.6" fill="#f1c772"/><text x="243" y="630" font-size="20" fill="#88a6ad" >同尺主角仅约3.6px高，不能靠放大主角表现巨鲸。</text><rect x="60" y="770" width="800" height="430" rx="14" fill="#122b36" stroke="#335460" stroke-width="2"/><text x="86" y="815" font-size="30" fill="#d2e1dd" >局部游玩镜头</text><rect x="100" y="850" width="720" height="290" rx="0" fill="#173440" stroke="#526f76" stroke-width="2"/><path d="M110 1050H320v-40H530v25H810" fill="none" stroke="#b1d3cb" stroke-width="6"/><path d="M140 900Q450 790 770 920" fill="none" stroke="#3d5864" stroke-width="16"/><circle cx="390" cy="997" r="3" fill="#ddd6bf"/><path d="M390 1000v7l-4 3m4 -3l4 3" fill="none" stroke="#8ebbb9" stroke-width="4"/><text x="120" y="1105" font-size="22" fill="#d8bd82" >镜头约5–8m高 → 主角占高约4–6%</text><text x="87" y="1170" font-size="20" fill="#88a6ad" >单房宽约7.2–14.4m；局部可玩边清楚，远景曲面继续延伸。</text><rect x="900" y="770" width="840" height="430" rx="14" fill="#122b36" stroke="#335460" stroke-width="2"/><text x="928" y="815" font-size="29" fill="#d2e1dd" >角色身份放大框 · 与左图不同比例</text><circle cx="1080" cy="931" r="45" fill="#d8d2bb"/><circle cx="1090" cy="928" r="24" fill="#182d35"/><path d="M1055 972L1025 1050L1105 1038L1120 980Z" fill="#417579"/><path d="M1067 1027v38l-22 7m47 -42v33l22 5" stroke="#729498" stroke-width="12" fill="none"/><circle cx="1060" cy="1005" r="12" fill="#dca14d"/><text x="1195" y="910" font-size="23" fill="#88a6ad" >圆潜水盔、单暗镜、青短披风与单腰灯锁定身份</text><text x="1195" y="945" font-size="23" fill="#88a6ad" >。此框只用于辨识角色；不能拿放大框的角色去</text><text x="1195" y="980" font-size="23" fill="#88a6ad" >量鲸体。</text><rect x="60" y="1250" width="1680" height="250" rx="14" fill="#122b36" stroke="#335460" stroke-width="2"/><text x="86" y="1298" font-size="32" fill="#d8bd82" >地图总宽 ≠ 鲸体总长</text><text x="86" y="1346" font-size="23" fill="#d2e1dd" >36房横向宽度合计1235U，即370.5m。路线分布在不同器官表面、前后侧层、折返肠袢与分支中；不能把它们一字拼接，也不能将示意图当</text><text x="86" y="1381" font-size="23" fill="#d2e1dd" >成精确碰撞总图。</text><text x="86" y="1457" font-size="23" fill="#88a6ad" >区域原画看尺度与空间意图；房间结构图看门位、接触面与动作距离。</text><text x="60" y="1555" font-size="21" fill="#d8bd82" >120m属于原创幻想设定，非真实蓝鲸尺寸；镜头数值是美术设计起点，尚未经过引擎实测。</text></svg>