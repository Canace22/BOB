<!doctype html>
<html lang="zh-CN">
<head>
  <base href="/mvp/">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071719"><title>鲸腹遗城 · 可玩序章</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 50'%3E%3Crect width='50' height='50' rx='12' fill='%230b252b'/%3E%3Cpath d='M8 28Q25 48 42 18Q29 26 28 10Q25 27 8 28Z' fill='%23d4c29b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="viewport">
  <canvas id="game" width="1280" height="720" aria-label="鲸腹遗城横版探索游戏，方向键移动，空格跳跃，E共鸣"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <section id="title-screen" class="screen title-screen">
    <div class="edition"><span class="whale-mark">◡</span> 深海探索手记 <span class="edition-line"></span> 第一章</div>
    <div class="title-copy">
      <p class="eyebrow">W H A L E F A L L</p>
      <h1>鲸腹遗城</h1>
      <div class="gold-rule"></div>
      <p class="poem">循着最后一声鲸歌，<br>走进一座仍在呼吸的遗城。</p>
      <button id="start-btn" class="primary" disabled><span>正在点亮提灯…</span><span>↗</span></button>
      <button id="continue-btn" class="text-button hidden">继续上次的旅程 <span>→</span></button>
      <p class="journey-note">三处秘境 · 三枚记忆 · 一次深海回响</p>
    </div>
    <div class="title-bottom"><span>一鲸落，万物生。</span><span>可玩序章 <i></i> MVP 01</span></div>
    <div class="title-coordinate">ABYSSAL ARCHIVE<br>01 — 03<br><b>1,240 m ↓</b></div>
  </section>
  <section id="hud" class="hidden" aria-label="游戏状态">
    <div class="hud-left"><div class="mini-brand">鲸腹遗城 <span>WHALEFALL</span></div><div class="vitals"><span id="health" aria-label="生命值"></span><span class="separator"></span><button id="journal-btn" title="记忆手记 J"><span class="memory-symbol">◇</span> <span id="memory-count">0 / 3</span></button></div></div>
    <div class="chapter"><span id="chapter-number" class="eyebrow">01 / 03</span><h2 id="room-name">鲸口门庭</h2><p id="objective"></p></div>
    <div class="hud-right"><button id="map-btn" class="icon-button" title="探索地图 M" aria-label="探索地图">⌘</button><button id="sound-btn" class="icon-button" title="切换声音" aria-label="静音">♫</button><button id="pause-btn" class="icon-button" title="暂停 Esc" aria-label="暂停">Ⅱ</button></div>
    <div class="depth"><span>深度</span><b id="depth-value">1,240</b><span>m</span><div></div></div>
    <div class="control-strip"><span><kbd>A</kbd><kbd>D</kbd> 移动</span><span><kbd>空格</kbd> 浮跃 · 可二段</span><span><kbd>E</kbd> 共鸣</span><span><kbd>M</kbd> 地图</span></div>
    <div class="resonance-indicator"><span>骨叉共鸣</span><div><i id="cooldown-bar"></i></div><span id="resonance-ready">就绪</span></div>
    <div id="context-hint" class="context-hint hidden"></div>
    <div id="toast" class="toast hidden" role="status"></div>
    <div id="room-intro" class="room-intro hidden"><span id="intro-number"></span><h2 id="intro-title"></h2><p id="intro-subtitle"></p></div>
  </section>
  <section id="overlay" class="screen overlay hidden" role="dialog" aria-modal="true" aria-labelledby="overlay-title"><button id="overlay-close" class="overlay-close" data-menu="resume" aria-label="关闭并继续探索">×</button><div id="overlay-content"></div></section>
  <div id="touch-controls" class="touch-controls hidden"><div><button data-hold="left" aria-label="向左">←</button><button data-hold="right" aria-label="向右">→</button></div><div><button data-action="resonance">共鸣</button><button data-action="jump">浮跃</button></div></div>
  <div id="loading-error" class="hidden" role="alert"></div>
</main>
<script type="module" src="./game.js"></script>
</body></html>
