<text x="34" y="721" class="tag">黄色虚线：上跳支路 / 取物 / 开闩后返回主路　　青色箭头：从P4跳回桥与P3</text>
<text x="34" y="749" class="small">R1_03_SHELL_LATCH：永久开闩ID。旧存档缺字段默认关闭；死亡、换房、实际重启均应保留已开启状态。</text>
<text x="34" y="777" class="small">待验证：真实输入支路往返、桥展开碰撞时序、重复E、失败恢复、退出重载。示意图不能代替实机通过证据。</text>
<text x="34" y="811" class="small">正式美术与动态以art-standard.md / asset-plan.json为合同；本图是结构规格，不是游戏截图或已完成原画。</text>
