<text x="34" y="43" class="title">须门遗港 v0.2 · 五房主线与舌台支路</text>
<text x="34" y="70" class="sub">设计示意 / waiting verification · 保留原主线；本房壳闩短桥不是跨器官捷径</text>

<g transform="translate(34,100)"><rect width="190" height="142" rx="12" class="room"/><text x="14" y="28" class="tag">R1-01 · 30×18U</text><text x="14" y="58" class="name">外伤坡</text><text x="14" y="86">口角外侧 / 下颌前段</text><text x="14" y="109" class="small">鼻端约3–10m</text><text x="14" y="130" class="tag">营地 · 安全走跳</text></g>
<g transform="translate(264,100)"><rect width="190" height="142" rx="12" class="room"/><text x="14" y="28" class="tag">R1-02 · 38×21U</text><text x="14" y="58" class="name">须筛</text><text x="14" y="86">侧壁 / 上颚须下缘</text><text x="14" y="109" class="small">鼻端约8–18m</text><text x="14" y="130" class="tag">单蟹 · 分层动态样板</text></g>
<g transform="translate(494,100)"><rect width="190" height="142" rx="12" class="room"/><text x="14" y="28" class="tag">R1-03 · 36×18U</text><text x="14" y="58" class="name">舌台</text><text x="14" y="86">舌体背面 / 口腔腹侧</text><text x="14" y="109" class="small">鼻端约12–23m</text><text x="14" y="130" class="tag">双蟹 · 碎片 / 壳闩</text></g>
<g transform="translate(724,100)"><rect width="190" height="142" rx="12" class="room"/><text x="14" y="28" class="tag">R1-04 · 36×18U</text><text x="14" y="58" class="name">负壳蟹</text><text x="14" y="86">舌根后方 / 口咽入口</text><text x="14" y="109" class="small">鼻端约20–29m</text><text x="14" y="130" class="tag">营地 · Boss · A1授能</text></g>
<g transform="translate(954,100)"><rect width="190" height="142" rx="12" class="room"/><text x="14" y="28" class="tag">R1-05 · 38×18U</text><text x="14" y="58" class="name">流膜育窝</text><text x="14" y="86">咽后 / 食管前段</text><text x="14" y="109" class="small">鼻端约27–32m</text><text x="14" y="130" class="tag">三次跳冲 · H1 · 出口</text></g>
<path d="M224 171 H264 M454 171 H494 M684 171 H724 M914 171 H954" class="route" marker-start="url(#arrow)"/>
<text x="34" y="276" class="small">起点 → 口角旧裂口 → 真正口腔腔隙 → 舌体背面 → 咽前宽台 → 纵裂食管边缘 → 本轮出口</text>
<text x="34" y="301" class="small">每扇邻房门可返回；R1-04前进门需Boss胜利并承接A1。右端只预告胃域，不表示胃域已制作。</text>
<text x="34" y="326" class="small">轴向位置区间可重叠：局部房间沿上下/横向褶层转向；米数不是碰撞包围盒尺寸。</text>
<path d="M34 348 H1144" stroke="#38535c"/>

<text x="34" y="384" class="name">R1-03 舌台 · 局部几何与支路（1U=64px；图中等比24px/U）</text>
<text x="34" y="410" class="sub">主路原本可通过；U0是可选支台。E先取碎片，再次E开启壳闩；同次按键不触发两个事件。</text>

