[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="art/action-hud-v1/*.json,art/fonts/OFL.txt,art/whalebelly/runtime/audio/score/COPYING.txt,art/whalebelly/**/*.json,art/whalebelly/rooms.json,art/tide-picker-action36/*.json,content/whalebelly/world/rooms.json,content/whalebelly/layout/rooms.json,content/whalebelly/environment/ecology-19.json,content/narrative/campaign_story.json,art/combat-animation-v2/player/*.json,art/combat-animation-v2/enemies/*.json,art/enemy-lab-readability-v1/atlas.json"
exclude_filter="build/*,tests/*,tools/*,*.md,art/manifest.json,content/whalebelly/recovery-manifest.json,content/whalebelly/runtime-resources.json"
export_path="build/web/index.html"
script_export_mode=2

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
